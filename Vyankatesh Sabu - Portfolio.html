  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

h. Sambhaji Nagar<\u002Fdiv>\n          <ul style=\"margin:0; padding-left:20px; color:#c7cbc2; font-size:15px; line-height:1.7;\">\n            <li>Reduced cold-start loading time by 86% through architecture and performance optimization.<\u002Fli>\n            <li>Integrated a Retrofit API layer and refactored WebView caching, cutting page-load delays ~40%.<\u002Fli>\n            <li>Shipped push notifications with custom Text-to-Speech voice alerts for real-time engagement.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PROJECTS -->\n  <section id=\"projects\" data-screen-label=\"Projects\" style=\"padding:100px 48px; max-width:1100px; margin:0 auto; position:relative; z-index:1;\">\n    <div style=\"font-family:'JetBrains Mono',monospace; color:#39ff14; font-size:14px; margin-bottom:14px;\">$ ls ./projects<\u002Fdiv>\n    <h2 style=\"font-size:34px; font-weight:600; margin:0 0 40px 0;\">Projects<\u002Fh2>\n\n    <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:28px;\">\n      <div style=\"border:1px solid #22261e; border-radius:4px; padding:32px; background:#0f110d; display:flex; flex-direction:column;\">\n        <div style=\"display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;\">\n          <div style=\"font-size:21px; font-weight:600;\">Homigo<\u002Fdiv>\n          <a href=\"https://github.com/Vyankatesh-Sabu/Homigo\" target=\"_blank\" style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#8b9186; text-decoration:none;\">GitHub ↗<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#8b9186; margin-bottom:8px;\">Apr 2026 — Present<\u002Fdiv>\n        <div style=\"color:#8b9186; font-size:14px; margin-bottom:18px;\">Urban service marketplace · full stack<\u002Fdiv>\n        <p style=\"font-size:15px; line-height:1.65; color:#c7cbc2; margin:0 0 18px 0;\">\n          A service booking platform with 28+ production-ready features across three isolated roles (customer, admin,\n          partner) — booking, payments, and workflows end-to-end. JWT + Spring Security enforce multi-role access;\n          Redis caches hot booking data. Android client uses MVVM + Repository with real-time UI, Razorpay payments,\n          and Cloudinary media.\n        <\u002Fp>\n        <div style=\"display:flex; flex-wrap:wrap; gap:8px; margin-top:auto;\">\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#39ff14;\">Kotlin<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#39ff14;\">Jetpack Compose<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#39ff14;\">Spring Boot<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#39ff14;\">MongoDB<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#39ff14;\">Redis<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#39ff14;\">Razorpay<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #22261e; border-radius:4px; padding:32px; background:#0f110d; display:flex; flex-direction:column;\">\n        <div style=\"display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;\">\n          <div style=\"font-size:21px; font-weight:600;\">SafeMail<\u002Fdiv>\n          <a href=\"https://github.com/Vyankatesh-Sabu/SafeMail\" target=\"_blank\" style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#8b9186; text-decoration:none;\">GitHub ↗<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#8b9186; margin-bottom:8px;\">Oct 2025<\u002Fdiv>\n        <div style=\"color:#8b9186; font-size:14px; margin-bottom:18px;\">Email security &amp; processing backend<\u002Fdiv>\n        <p style=\"font-size:15px; line-height:1.65; color:#c7cbc2; margin:0 0 18px 0;\">\n          A secure email processing pipeline for automated phishing/spam detection over Gmail APIs with real-time\n          inbox monitoring. Streams mailbox events via the Gmail Watch API into an ML classifier and an automated\n          quarantine workflow. OAuth 2.0 + AES-GCM encrypted refresh tokens — no plaintext credentials, ever.\n        <\u002Fp>\n        <div style=\"display:flex; flex-wrap:wrap; gap:8px; margin-top:auto;\">\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#39ff14;\">Java<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#39ff14;\">Spring Boot<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#39ff14;\">Gmail API<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#39ff14;\">OAuth 2.0<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#39ff14;\">AES-GCM<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#39ff14;\">Docker<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SYSTEM DESIGN -->\n  <section id=\"systems\" data-screen-label=\"System Design\" style=\"padding:100px 48px; max-width:1100px; margin:0 auto; position:relative; z-index:1;\">\n    <div style=\"font-family:'JetBrains Mono',monospace; color:#39ff14; font-size:14px; margin-bottom:14px;\">$ cat ./systems/architecture.md<\u002Fdiv>\n    <h2 style=\"font-size:34px; font-weight:600; margin:0 0 12px 0;\">System Design<\u002Fh2>\n    <p style=\"color:#8b9186; font-size:15px; max-width:640px; margin:0 0 44px 0;\">\n      Two systems where the interesting decisions happened below the API layer.\n    <\u002Fp>\n\n    <div style=\"border:1px solid #22261e; border-radius:4px; padding:36px; background:#0f110d; margin-bottom:28px;\">\n      <div style=\"font-size:20px; font-weight:600; margin-bottom:6px;\">Homigo — Multi-Role Marketplace Core<\u002Fdiv>\n      <p style=\"color:#8b9186; font-size:14px; margin:0 0 24px 0;\">Three roles, one backend, no cross-role data leaks.<\u002Fp>\n      <div style=\"display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; align-items:stretch; margin-bottom:24px;\">\n        <div style=\"border:1px solid #33382c; border-radius:4px; padding:16px; text-align:center; font-family:'JetBrains Mono',monospace; font-size:13px;\">Android Client<br><span style=\"color:#8b9186; font-size:11px;\">MVVM + Repository<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; align-items:center; justify-content:center; color:#39ff14; font-family:'JetBrains Mono',monospace;\">→<\u002Fdiv>\n        <div style=\"border:1px solid #39ff14; border-radius:4px; padding:16px; text-align:center; font-family:'JetBrains Mono',monospace; font-size:13px;\">JWT + Spring Security<br><span style=\"color:#8b9186; font-size:11px;\">role-scoped access<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; align-items:center; justify-content:center; color:#39ff14; font-family:'JetBrains Mono',monospace;\">→<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; align-items:stretch; margin-bottom:24px;\">\n        <div style=\"border:1px solid #33382c; border-radius:4px; padding:16px; text-align:center; font-family:'JetBrains Mono',monospace; font-size:13px;\">Customer / Partner / Admin<br><span style=\"color:#8b9186; font-size:11px;\">isolated service layers<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; align-items:center; justify-content:center; color:#39ff14; font-family:'JetBrains Mono',monospace;\">→<\u002Fdiv>\n        <div style=\"border:1px solid #33382c; border-radius:4px; padding:16px; text-align:center; font-family:'JetBrains Mono',monospace; font-size:13px;\">Redis<br><span style=\"color:#8b9186; font-size:11px;\">hot booking cache<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; align-items:center; justify-content:center; color:#39ff14; font-family:'JetBrains Mono',monospace;\">→<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; align-items:stretch; margin-bottom:24px;\">\n        <div><\u002Fdiv><div><\u002Fdiv>\n        <div style=\"border:1px solid #33382c; border-radius:4px; padding:16px; text-align:center; font-family:'JetBrains Mono',monospace; font-size:13px;\">MongoDB<br><span style=\"color:#8b9186; font-size:11px;\">bookings &amp; workflows<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; align-items:center; justify-content:center; color:#39ff14; font-family:'JetBrains Mono',monospace;\">→<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:14.5px; line-height:1.7; color:#c7cbc2; margin:0;\">\n        <strong style=\"color:#e9ede6;\">Key decision:<\u002Fstrong> access control is enforced at the service layer per role, not\n        just at the route level — so a compromised admin token can't accidentally touch partner-only mutations.\n        Redis sits in front of MongoDB for booking reads that get hit repeatedly (availability checks), cutting\n        redundant DB round-trips without adding cache-invalidation complexity to the write path.\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #22261e; border-radius:4px; padding:36px; background:#0f110d;\">\n      <div style=\"font-size:20px; font-weight:600; margin-bottom:6px;\">DBSync — Cross-Environment Schema Diffing<\u002Fdiv>\n      <p style=\"color:#8b9186; font-size:14px; margin:0 0 24px 0;\">A CLI that replaces manual schema reconciliation with a directional diff.<\u002Fp>\n      <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:24px; flex-wrap:wrap;\">\n        <div style=\"border:1px solid #33382c; border-radius:4px; padding:14px 18px; font-family:'JetBrains Mono',monospace; font-size:13px;\">staging DB<\u002Fdiv>\n        <span style=\"color:#39ff14; font-family:'JetBrains Mono',monospace;\">⇆<\u002Fspan>\n        <div style=\"border:1px solid #33382c; border-radius:4px; padding:14px 18px; font-family:'JetBrains Mono',monospace; font-size:13px;\">SSH tunnel<\u002Fdiv>\n        <span style=\"color:#39ff14; font-family:'JetBrains Mono',monospace;\">⇆<\u002Fspan>\n        <div style=\"border:1px solid #33382c; border-radius:4px; padding:14px 18px; font-family:'JetBrains Mono',monospace; font-size:13px;\">prod DB<\u002Fdiv>\n        <span style=\"color:#39ff14; font-family:'JetBrains Mono',monospace;\">→<\u002Fspan>\n        <div style=\"border:1px solid #39ff14; border-radius:4px; padding:14px 18px; font-family:'JetBrains Mono',monospace; font-size:13px;\">directional sync plan<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:14.5px; line-height:1.7; color:#c7cbc2; margin:0;\">\n        Built after watching QA manually eyeball schema drift between environments. DBSync connects to both databases\n        over SSH tunnels, diffs table/column/constraint definitions, and outputs an ordered, directional plan —\n        removing a recurring manual step from every release.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ACHIEVEMENTS -->\n  <section id=\"achievements\" data-screen-label=\"Achievements\" style=\"padding:100px 48px; max-width:1100px; margin:0 auto; position:relative; z-index:1;\">\n    <div style=\"font-family:'JetBrains Mono',monospace; color:#39ff14; font-size:14px; margin-bottom:14px;\">$ cat achievements.log<\u002Fdiv>\n    <h2 style=\"font-size:34px; font-weight:600; margin:0 0 40px 0;\">Achievements<\u002Fh2>\n    <div style=\"display:grid; grid-template-columns:repeat(4, 1fr); gap:20px;\">\n      <div style=\"border:1px solid #22261e; border-radius:4px; padding:24px; background:#0f110d;\">\n
